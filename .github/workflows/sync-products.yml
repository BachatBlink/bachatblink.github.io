name: Sync Affiliate Products

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch Affiliate Products
        env:
          CLICKWISE_API_KEY: ${{ secrets.CLICKWISE_API_KEY }}
        run: python fetch_products.py
      - name: Commit updated products.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update affiliate products" && git push)
